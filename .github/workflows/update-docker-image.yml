name: "Update Docker Image"

on:
  push:
    branches: ["master"]
  schedule:
    - cron: 59 23 * * 0
  workflow_dispatch:

jobs:
  publish:
    name: Push image to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Extract branch name
        shell: bash
        run: echo "branch=$(echo ${GITHUB_REF#refs/heads/})" >> $GITHUB_OUTPUT
        id: branch

      - name: Derive image name
        id: image
        shell: bash
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "name=ghcr.io/${OWNER,,}/${GITHUB_REPOSITORY#*/}" >> $GITHUB_OUTPUT

      - name: Get commit sha
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Check out the git repo
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: AB_GITHUB_ORG=${{ github.repository_owner }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.branch.outputs.branch }}
            ${{ steps.image.outputs.name }}:${{ steps.sha.outputs.short }}
